name: palco-player
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: palco-player:1.2.0
    restart: unless-stopped
    ports:
      # Apenas loopback: requer integracao deliberada ao proxy HTTPS da VPS.
      - "127.0.0.1:${PALCO_LOCAL_PORT:-18712}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
