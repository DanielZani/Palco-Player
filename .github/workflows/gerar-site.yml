name: Gerar player e documentação
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-guias.txt
      - run: python scripts/gerar_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: palco-player-site
          path: dist/
          if-no-files-found: error
